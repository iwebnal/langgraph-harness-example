[project]
name = "release-triage-agent"
version = "0.1.0"
description = "Educational LangGraph agent designed to be wrapped with harness engineering practices."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0.0",
  "langchain-core>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
