version: 1
harness_policy:
  filesystem:
    allowed_change_prefixes:
      - src/
      - tests/
      - docs/
    denied_change_prefixes:
      - .git/
      - .github/workflows/
      - venv/
      - .venv/
      - __pycache__/
      - secrets/
      - harness/audit/
    protected_files:
      - .env
      - harness/policy.yaml
    protected_suffixes:
      - .pem
      - .key
  changes:
    max_changed_files: 5
    max_patch_lines: 300
    max_patch_size_bytes: 100000
  approvals:
    require_for_risk_markers:
      - approval
      - auth
      - deployment
      - high
      - migration
      - production
  tooling:
    allowed_tool_ids:
      - test.pytest
      - lint.ruff.check
      - typecheck.mypy
      - dependency.pip.check
    sandbox_required: true
    network_policy: off
    denied_tokens:
      - rm
      - sudo
      - ssh
      - curl
      - wget
      - docker
      - kubectl
      - git
      - gh
rules:
  - id: high-risk-needs-approval
    description: High-risk changes must not produce an execution plan unless approval is present.
    check: state.risk_level == "high" implies state.approval == "approved"
  - id: rollback-required
    description: Every generated release plan must include rollback instructions.
    check: plan contains rollback
  - id: unknown-service-blocked
    description: Unknown service ownership should block execution, not auto-plan.
    check: state.service_context.owner != "unknown"
